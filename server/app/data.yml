# ---------------------------------
# DO NOT EDIT THIS FILE!
# This is reserved for system use!
# ---------------------------------
name: Wiki.js NG
defaults:
  config:
    # File defaults
    port: 80
    db:
      type: postgres
      host: localhost
      port: 5432
      user: wikijs
      pass: changeme
      db: wiki
      ssl: false
      storage: ./db.sqlite
      sslOptions:
        auto: true
    ssl:
      enabled: false
    pool:
      min: 1
    bindIP: 0.0.0.0
    logLevel: info
    logFormat: default
    offline: false
    ha: false
    bodyParserLimit: 5mb
    # DB defaults
    api:
      isEnabled: false
    lang:
      code: en
      namespaces: []
      namespacing: false
      rtl: false
    title: Wiki.js NG
    company: ''
    contentLicense: ''
    footerOverride: ''
    logoUrl: /_assets/svg/logo-swissmakers.svg
    pageExtensions:
      - md
      - html
      - txt
    mail:
      host: ''
      secure: true
      verifySSL: true
    nav:
      mode: 'MIXED'
    theming:
      theme: 'default'
      iconset: 'mdi'
      darkMode: false
      tocPosition: 'left'
    auth:
      autoLogin: false
      enforce2FA: false
      hideLocal: false
      loginBgUrl: ''
      audience: 'urn:wiki.js'
      tokenExpiration: '30m'
      tokenRenewal: '14d'
    editShortcuts:
      editFab: true
      editMenuBar: false
      editMenuBtn: true
      editMenuExternalBtn: true
      editMenuExternalName: 'GitHub'
      editMenuExternalIcon: 'mdi-github'
      editMenuExternalUrl: 'https://github.com/org/repo/blob/main/{filename}'
    features:
      featurePageComments: true
    security:
      securityOpenRedirect: true
      securityIframe: true
      securityReferrerPolicy: true
      securityTrustProxy: false
      securityHSTS: false
      securityHSTSDuration: 300
      securityCSP: false
      securityCSPDirectives: ''
    server:
      sslRedir: false
    uploads:
      maxFileSize: 5242880
      maxFiles: 10
      scanSVG: true
      forceDownload: true
    flags:
      ldapdebug: false
      sqllog: false
    # System defaults
    setup: false
    dataPath: ./data
    search:
      maxHits: 100
    maintainerEmail: security@swissmakers.ch
jobs:
  purgeUploads:
    onInit: true
    schedule: PT15M
    offlineSkip: false
    repeat: true
  rebuildTree:
    onInit: true
    offlineSkip: false
    repeat: false
    immediate: true
    worker: true
groups:
  defaultPermissions:
    - 'read:pages'
    - 'read:assets'
    - 'read:comments'
    - 'write:comments'
  defaultPageRules:
    - id: default
      deny: false
      match: START
      roles:
        - 'read:pages'
        - 'read:assets'
        - 'read:comments'
        - 'write:comments'
      path: ''
      locales: []
reservedPaths:
  - login
  - logout
  - register
  - verify
  - favicons
  - fonts
  - img
  - js
  - svg
# ---------------------------------

extends:
  - standard
  - plugin:vue/strongly-recommended
env:
  node: true
parserOptions:
  parser: '@babel/eslint-parser'
  requireConfigFile: false
  ecmaVersion: 2022
  allowImportExportEverywhere: true
globals:
  document: false
  navigator: false
  window: false
  siteConfig: false
  siteLangs: false
rules:
  # Single-word names (page, editor, comments, ...) are the global components the server views mount
  vue/multi-word-component-names: off
overrides:
  - files:
      - 'dev/cypress/**'
    extends:
      - plugin:cypress/recommended
  - files:
      - 'server/test/**'
      - 'client/test/**'
    env:
      jest: true
